[project]
name = "trakt-ical-bridge"
version = "0.1.0"
description = "Self-hosted Trakt upcoming shows to iCalendar feed bridge."
requires-python = ">=3.11"
dependencies = [
  "Flask==3.0.3",
  "requests==2.32.3",
  "waitress==3.0.0",
]

[project.scripts]
trakt-ical-bridge = "trakt_ical_bridge.app:main"

[tool.pytest.ini_options]
pythonpath = ["."]
